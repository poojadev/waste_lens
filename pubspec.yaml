name: waste_lens_workspace
description: >-
  Workspace root for the waste_lens federated package set
  (core, dio add-on, lints add-on, example).
publish_to: none

environment:
  sdk: ^3.6.0

workspace:
  - packages/waste_lens
  - packages/waste_lens_dio
  - packages/waste_lens_lints
  - example

dev_dependencies:
  flutter_lints: ^6.0.0
