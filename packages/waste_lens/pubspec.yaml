name: waste_lens
description: >-
  Live in-app detector for wasted Flutter work — dead rebuilds, redundant API
  calls, memory leaks, and memory pressure. Debug/profile only, a no-op in
  release.
version: 0.1.0
repository: https://github.com/poojadev/waste_lens
issue_tracker: https://github.com/poojadev/waste_lens/issues
topics:
  - performance
  - profiling
  - debugging
  - memory

environment:
  sdk: ^3.6.0
  flutter: ">=3.24.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # SDK-constrained — kept deliberately loose so they defer to the consumer's
  # Flutter SDK. A tight caret here is the #1 cause of resolution conflicts.
  collection: ^1.19.0
  meta: ^1.16.0
  vm_service: ">=14.0.0 <16.0.0"
  leak_tracker: ">=10.0.0 <12.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  leak_tracker_flutter_testing: ">=3.0.0 <4.0.0"
