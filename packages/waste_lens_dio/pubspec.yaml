name: waste_lens_dio
description: >-
  Dio add-on for waste_lens: detect redundant API calls, coalesce in-flight
  duplicate requests, and report wasted bytes via the waste_lens overlay.
version: 0.1.0
repository: https://github.com/poojadev/waste_lens
issue_tracker: https://github.com/poojadev/waste_lens/issues
topics:
  - performance
  - profiling
  - debugging
  - dio

environment:
  sdk: ^3.6.0
  flutter: ">=3.24.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  waste_lens: ^0.1.0
  dio: ^5.9.2
  crypto: ^3.0.6
  meta: ^1.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
